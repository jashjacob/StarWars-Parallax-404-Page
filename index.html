<!DOCTYPE html>
<html>
<head>

	<meta charset="utf-8">

	<title>404 Page</title>
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<link rel="stylesheet" type="text/css" href="styles/styles.css"/>

</head>
<body>

	<div id="container" class="container">
		<ul id="scene" class="scene">
		<li class="layer" data-depth="0.00">
			<picture>
				<source srcset="images/bg.webp" type="image/webp">
				<img src="images/bg.png" alt="Star Wars background">
			</picture>
		</li>
		<li class="layer" data-depth="0.60">
			<picture>
				<source srcset="images/bg-layer-1.webp" type="image/webp">
				<img src="images/bg-layer-1.png" alt="Star Wars space dust and stars layer 1">
			</picture>
		</li>
		<li class="layer" data-depth="0.40">
			<picture>
				<source srcset="images/bg-layer-2.webp" type="image/webp">
				<img src="images/bg-layer-2.png" alt="Star Wars space dust layer 2">
			</picture>
		</li>
		<li class="layer" data-depth="0.92">
			<picture>
				<source srcset="images/404.webp" type="image/webp">
				<img src="images/404.png" alt="404 Page Not Found text">
			</picture>
		</li>
		<li class="layer" data-depth="0.82">
			<picture>
				<source srcset="images/yhr.webp" type="image/webp">
				<img src="images/yhr.png" alt="Yoda lightsaber reflection glowing text">
			</picture>
		</li>
		<li class="layer" data-depth="0.70">
			<picture>
				<source srcset="images/yoda.webp" type="image/webp">
				<img src="images/yoda.png" alt="Yoda holding a lightsaber">
			</picture>
		</li>
		</ul>
		<div class="cta-container">
			<a href="/" class="glass-btn">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
					<path d="M19 12H5M12 19l-7-7 7-7"/>
				</svg>
				<span>Return to Safety</span>
			</a>
		</div>
	</div>
	<script src="parallax.js"></script>
	<script>
	var scene = document.getElementById('scene');
	var parallax = new Parallax(scene);
	</script>

</body>
</html>
